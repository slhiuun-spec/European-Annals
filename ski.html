<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colorado Ski Planner</title><style> *{box-sizing:border-box}body{margin:0;background:#101923;color:#e9e4d7;font:15px system-ui}main{max-width:none;margin:0;padding:24px;text-align:left}a{color:#e7c47d}nav{display:flex;gap:20px;align-items:center}h1{font-size:28px}section{background:#192532;border:1px solid #344352;border-radius:12px;padding:18px;margin:16px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}label{display:block}input,select,button{font:inherit;background:#243647;color:#f3eddd;border:1px solid #526473;border-radius:6px;padding:9px}input[type=date],select{width:100%;margin-top:5px}button{cursor:pointer}button.primary{background:#d7b46b;color:#142331;font-weight:bold}.checks{display:flex;gap:10px 20px;flex-wrap:wrap;margin:14px 0}.checks label{display:flex;align-items:center;gap:5px}.note{font-size:13px;color:#aebdca;line-height:1.6}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{text-align:left;padding:10px;border-bottom:1px solid #405365;vertical-align:top}th{color:#e7c47d}td small{display:block;color:#aebdca}.actions{display:flex;gap:8px;flex-wrap:wrap}.summary{font-weight:600}.warn{color:#e7c47d}textarea{width:100%;min-height:160px;background:#142331;color:#e9e4d7;border:1px solid #526473;padding:10px;border-radius:6px;font:inherit} .fields{grid-template-columns:repeat(auto-fit,minmax(170px,220px));justify-content:start}.checks,.actions,nav{justify-content:flex-start}table{width:max-content;min-width:min(850px,100%);margin:0}textarea{max-width:1000px}@media(max-width:600px){main{padding:12px}.fields{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}</style><main><nav><a href="index.html">← 欧罗巴春秋 / History</a><strong>Colorado Ski Planner</strong></nav><h1>科州滑雪查询 / Colorado Ski Planner</h1><p class="note">根据 2026-11-26 的滑雪查询对话建立。历史快照不是实时雪况。静态网页不能直接调用 ChatGPT 或读取所有雪场实时数据；使用下方实时查询入口获取最新结果。</p><section><form id="criteria"><div class="fields"><label>开始日期 / Start<input type="date" id="start" value="2026-11-25" required></label><label>结束日期 / End<input type="date" id="end" value="2026-11-30" required></label><label>雪票 / Pass<select id="pass"><option value="full">Ikon Full</option><option value="base">Ikon Base</option><option value="none">其他 / No pass</option></select></label><label>筛选 / Status<select id="status"><option value="all">全部 / All</option><option value="open">快照中已开放 / Open in snapshot</option><option value="known">有雪道数据 / Known trails</option></select></label></div><div id="resorts" class="checks"></div><div class="actions"><button class="primary" type="submit">生成查询结果 / Generate</button><button type="button" id="today">今天 / Today</button><button type="button" id="all">全选 / Select all</button></div></form></section><section><h2>日期对比 / Daily schedule</h2><p class="summary" id="summary"></p><p class="note" id="warning"></p><div class="scroll"><table id="table"></table></div></section><section><h2>实时查询 / Live research</h2><p class="note">下面的查询根据输入条件自动生成。点击后在 ChatGPT 新对话中执行，需联网并核实官方雪场状态；结果不会自动回填本网页。</p><textarea id="prompt" readonly></textarea><div class="actions"><button id="live" class="primary">在 ChatGPT 查询最新结果</button><button id="copy">复制查询条件</button></div><p id="copyStatus" class="note" aria-live="polite"></p></section></main><script>
const resorts=[
{id:'copper',name:'Copper Mountain',open:'2026-11-25',hours:'09:00–16:00',trails:'7 / 150',pass:'无限（此前查询）',url:'https://www.coppercolorado.com/'},
{id:'aspen',name:'Aspen Mountain',open:'2026-11-26',hours:'09:00–15:30',trails:'未取得',pass:'与 Snowmass 等共享7天（此前查询）',url:'https://www.aspensnowmass.com/'},
{id:'snowmass',name:'Snowmass',open:'2026-11-26',hours:'09:00–15:30',trails:'未取得',pass:'与 Aspen 等共享7天（此前查询）',url:'https://www.aspensnowmass.com/'},
{id:'steamboat',name:'Steamboat',open:'2026-11-27',hours:'08:30–16:00',trails:'未取得',pass:'此前查询称无限，需核实',url:'https://www.steamboat.com/'},
{id:'abasin',name:'Arapahoe Basin',open:'2026-11-25',hours:'09:00–16:00',trails:'2–4 / 147',pass:'此前查询称无限，需核实',url:'https://www.arapahoebasin.com/'},
{id:'winter',name:'Winter Park',open:'2026-11-25',hours:'09:00–16:00',trails:'8–9 / 171',pass:'无限（此前查询）',url:'https://www.winterparkresort.com/'},
{id:'eldora',name:'Eldora',open:'2026-11-25',hours:'09:00–16:00',trails:'未取得',pass:'无限（此前查询）',url:'https://www.eldora.com/'},
{id:'highlands',name:'Aspen Highlands',open:'2026-12-12',hours:'待核实',trails:'未取得',pass:'Aspen Snowmass 共享天数，需核实',url:'https://www.aspensnowmass.com/'},
{id:'buttermilk',name:'Buttermilk',open:'2026-12-12',hours:'待核实',trails:'未取得',pass:'Aspen Snowmass 共享天数，需核实',url:'https://www.aspensnowmass.com/'}];
const $=id=>document.getElementById(id);for(const r of resorts){const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.value=r.id;i.checked=true;l.append(i,document.createTextNode(r.name));$('resorts').append(l)}
function dateLocal(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function generate(){const start=$('start').value,end=$('end').value,pass=$('pass').selectedOptions[0].textContent,selected=resorts.filter(r=>[...$('resorts').querySelectorAll('input:checked')].some(i=>i.value===r.id));if(!start||!end||end<start){$('summary').textContent='请选择有效日期';$('table').replaceChildren();$('prompt').value='';return}const days=[];let d=new Date(start+'T12:00:00Z');while(d.toISOString().slice(0,10)<=end&&days.length<31){days.push(d.toISOString().slice(0,10));d.setUTCDate(d.getUTCDate()+1)}const rows=selected.filter(r=>$('status').value==='all'||($('status').value==='known'?r.trails!=='未取得':days.some(day=>day>='2026-11-25'&&day<='2026-11-30'&&day>=r.open)));const t=$('table');t.replaceChildren();function cell(row,tag,v){const c=document.createElement(tag);c.textContent=v;row.append(c);return c}const head=t.createTHead().insertRow();['雪场 / Resort',...days.map(x=>x.slice(5)),'11/26 trails','Pass / 预约','官方入口'].forEach(x=>cell(head,'th',x));const body=t.createTBody();for(const r of rows){const tr=body.insertRow();cell(tr,'td',r.name);for(const day of days){let value='待实时核实';if(day>='2026-11-25'&&day<='2026-11-30'){value=day<r.open?'计划未开':day==='2026-11-25'?'待核实':r.hours+'（快照/计划）'}cell(tr,'td',value)}cell(tr,'td',r.trails);cell(tr,'td',$('pass').value==='full'?r.pass+'；此前查询称滑雪无需预约，需核实':'待核实资格与预约');const c=cell(tr,'td',''),a=document.createElement('a');a.href=r.url;a.target='_blank';a.rel='noopener';a.textContent='Official';c.append(a)}
$('summary').textContent=rows.length+' 个雪场 · '+start+' 至 '+end;$('warning').textContent='仅显示此前对话的历史快照和计划，不代表实际开放。最多展示31天；超出历史快照日期一律待核实。雪道数量是11/26记录，不是每天预测。';$('prompt').value='请联网查询科罗拉多滑雪场，日期 '+start+' 至 '+end+'，雪票 '+pass+'。雪场：'+selected.map(r=>r.name).join(', ')+'。逐日列出实际或预计开门和关门时间（当地时间）、是否需要滑雪预约及停车预约、雪票覆盖及剩余/共享天数规则、开放 trails 数量与总数、开放 lifts、开放地形比例。按日期及雪场用表格比较，标注每项数据的更新时间与官方链接，区分计划、实时和未知，不要把历史雪况当成今天雪况。最后给出滑雪安排建议。';}
$('criteria').onsubmit=e=>{e.preventDefault();generate()};$('criteria').onchange=generate;$('today').onclick=()=>{$('start').value=$('end').value=dateLocal();generate()};$('all').onclick=()=>{$('resorts').querySelectorAll('input').forEach(i=>i.checked=true);generate()};$('live').onclick=()=>{if($('prompt').value)window.open('https://chatgpt.com/?q='+encodeURIComponent($('prompt').value),'_blank','noopener')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').value);$('copyStatus').textContent='已复制'}catch(e){$('prompt').select();$('copyStatus').textContent='请手动复制选中的查询'}};generate();
</script></html>
