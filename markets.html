<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{background:#101923;color:#e9e4d7;font:15px system-ui;margin:24px}nav{display:flex;gap:18px;flex-wrap:wrap}a{color:#e7c47d}section{border:1px solid #405365;border-radius:10px;padding:18px;margin:16px 0;background:#192532}input,select,textarea,button{font:inherit;background:#243647;color:#eee;border:1px solid #526473;border-radius:6px;padding:10px}button{cursor:pointer;background:#d7b46b;color:#182331;font-weight:bold}label{display:block;margin:10px 0}textarea{display:block;width:100%;max-width:1000px;min-height:150px}small,p{line-height:1.6}table{border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #405365;text-align:left}</style><title>Market Research</title><nav><a href="index.html">欧罗巴春秋</a><a href="ski.html">科州滑雪</a><a href="saltlake.html">盐湖城</a><a href="markets.html">Bloomberg 研究</a><a href="trading.html">自动交易</a></nav><h1>Bloomberg 市场研究 / Market Research</h1><p>独立研究工具，非 Bloomberg 官方产品。未连接 Bloomberg Terminal 或授权新闻 API，不转载付费内容。</p><section><h2>官方市场资讯</h2><p><a href="https://www.bloomberg.com/markets" target="_blank" rel="noopener">Markets</a> · <a href="https://www.bloomberg.com/newsletters" target="_blank" rel="noopener">Newsletters</a> · <a href="https://www.bloomberg.com/wealth/" target="_blank" rel="noopener">Wealth</a></p></section><section><h2>生成投资研究 / Research brief</h2><label>股票代码（逗号分隔） <input id="symbols" value="SPY, QQQ, NVDA, GOOGL, AAPL, MSFT"></label><label>时间范围 <select id="period"><option>最近24小时</option><option>最近7天</option><option>最近30天</option></select></label><label>研究重点 <select id="focus"><option>宏观、财报、AI资本开支、估值</option><option>利率、债券、美元、通胀</option><option>行业轮动、风险、资金流</option></select></label><label>投资周期 <select id="horizon"><option>1–3个月</option><option>6–12个月</option><option>3–5年</option></select></label><button id="generate">生成研究指令</button><textarea id="out" readonly></textarea><button id="query">在 ChatGPT 联网分析</button><p>生成的是独立研究指令，不是 Bloomberg 的荐股。AI 可能出错，研究结果不自动下单。</p></section><script>const $=id=>document.getElementById(id);function gen(){$('out').value='联网核查 '+$('period').value+' Bloomberg 公开可访问的市场报道及 SEC、公司财报、央行等一手资料。研究 '+$('symbols').value+'；重点：'+$('focus').value+'；周期：'+$('horizon').value+'。逐条列出新闻日期与链接，区分事实、Bloomberg报道、市场观点和独立分析；标注价格数据时间，给出多空情景、估值依据、主要风险和反证，不杜撰付费内容或实时数据，不自动下单。'}$('generate').onclick=gen;$('query').onclick=()=>{gen();window.open('https://chatgpt.com/?q='+encodeURIComponent($('out').value),'_blank','noopener')};['symbols','period','focus','horizon'].forEach(id=>$(id).onchange=gen);gen();</script></html>
